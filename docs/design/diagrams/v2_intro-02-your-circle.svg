city="1.0"/><line x1="449" y1="290" x2="361" y2="350" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="1.0"/><line x1="512" y1="288" x2="613" y2="352" stroke="#4f46e5" stroke-width="4.5" stroke-dasharray="7 7" stroke-linecap="round" opacity="1.0"/><g transform="translate(454,225)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="480" y="329" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">YOU</text><g transform="translate(229,157)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="255" y="261" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Ana</text><text x="255" y="277" font-size="11.5" fill="#94a3b8" text-anchor="middle">bumped ✓</text><g transform="translate(679,149)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="705" y="253" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Ben</text><text x="705" y="269" font-size="11.5" fill="#94a3b8" text-anchor="middle">bumped ✓</text><g transform="translate(304,329)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="330" y="433" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Cleo</text><text x="330" y="449" font-size="11.5" fill="#94a3b8" text-anchor="middle">bumped ✓</text><g transform="translate(619,329)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="645" y="433" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Dan</text><text x="645" y="449" font-size="11.5" fill="#94a3b8" text-anchor="middle">out of range · still yours</text><g transform="translate(122,270)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(547,90)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(817,260)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(462,390)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(340,221)"><rect width="54" height="26" rx="13" fill="#ffffff" stroke="#4f46e5"/><text x="27" y="17.5" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">bump</text></g><line x1="70" y1="108" x2="100" y2="108" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><text x="110" y="112" font-size="12.5" fill="#475569">your Circle — people you paired with, on purpose</text><line x1="70" y1="127" x2="100" y2="127" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/><text x="110" y="131" font-size="12.5" fill="#475569">the mesh underneath — still there, still carrying packets</text><rect x="60" y="480" width="840" height="62" rx="12" fill="#eef2ff" stroke="#4f46e5"/><text x="480" y="506" font-size="14" font-weight="600" fill="#3730a3" text-anchor="middle">Your Circle is a virtual mesh on top of the physical one — a web of trust, built one bump at a time.</text><text x="480" y="528" font-size="13" fill="#4338ca" text-anchor="middle">Strangers stay strangers: they can forward your packets, but only your Circle can read your relay or send you anything.</text></svg>