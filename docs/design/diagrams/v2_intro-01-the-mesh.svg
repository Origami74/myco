0"/><line x1="294" y1="359" x2="168" y2="311" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/><line x1="366" y1="384" x2="451" y2="411" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" opacity="1.0"/><g transform="translate(358,225)"><rect width="18" height="18" rx="5" fill="#4f46e5"/><path d="M6.5 5.5 L12 11 L9 13.5 L9 3.5 L12 6 L6.5 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(761,232)"><rect width="18" height="18" rx="5" fill="#4f46e5"/><path d="M6.5 5.5 L12 11 L9 13.5 L9 3.5 L12 6 L6.5 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(396,387)"><rect width="18" height="18" rx="5" fill="#4f46e5"/><path d="M6.5 5.5 L12 11 L9 13.5 L9 3.5 L12 6 L6.5 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(454,225)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="480" y="329" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">YOU</text><g transform="translate(229,157)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="255" y="261" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Ana</text><g transform="translate(679,149)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="705" y="253" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Ben</text><g transform="translate(304,329)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/></g><text x="330" y="433" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Cleo</text><g transform="translate(6