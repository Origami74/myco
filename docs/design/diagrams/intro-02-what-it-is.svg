text-anchor="middle">out of range · catches up later</text><g transform="translate(122,270)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(572,130)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(817,260)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><g transform="translate(462,390)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><text x="660" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">a stranger's phone</text><text x="660" y="120" font-size="11" fill="#94a3b8" text-anchor="middle">forwards your packets to Ben —</text><text x="660" y="133" font-size="11" fill="#94a3b8" text-anchor="middle">encrypted, so it can't read them</text><line x1="70" y1="104" x2="100" y2="104" stroke="#d6dbe3" stroke-width="3" stroke-linecap="round"/><text x="110" y="108" font-size="12.5" fill="#475569">the FIPS mesh — whoever is in range; always there</text><line x1="70" y1="123" x2="100" y2="123" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><text x="110" y="127" font-size="12.5" fill="#475569">your Circle — people you bumped with, on purpose</text><line x1="70" y1="142" x2="100" y2="142" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><text x="110" y="146" font-size="12.5" fill="#475569">an app, and what you do in it — along your Circle only</text><rect x="60" y="480" width="840" height="62" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="480" y="506" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle">Build a Circle of people you trust on top of the mesh. Apps come from them; what you do in those apps goes to them.</text><text x="480" y="528" font-size="13" fill="#166534" text-anchor="middle">Anyone who has an app can pass it on, so apps spread on their own. No server, no internet, no stranger who can read a thing.</text></svg>