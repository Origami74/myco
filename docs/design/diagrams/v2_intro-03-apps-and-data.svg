" opacity="1.0"/><line x1="449" y1="290" x2="361" y2="350" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round" opacity="1.0"/><line x1="512" y1="288" x2="613" y2="352" stroke="#4f46e5" stroke-width="4.5" stroke-dasharray="7 7" stroke-linecap="round" opacity="1.0"/><g transform="translate(342,213)"><rect width="38" height="38" rx="10" fill="#16a34a"/><rect x="9" y="9" width="8" height="8" rx="2" fill="#fff"/><rect x="21" y="9" width="8" height="8" rx="2" fill="#fff"/><rect x="9" y="21" width="8" height="8" rx="2" fill="#fff"/><rect x="21" y="21" width="8" height="8" rx="2" fill="#fff" opacity="0.6"/></g><text x="361" y="265" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">an app, from Ana</text><g transform="translate(582,215)"><rect width="44" height="22" rx="11" fill="#ffffff" stroke="#4f46e5"/><circle cx="13" cy="11" r="2.8" fill="#4f46e5"/><circle cx="22" cy="11" r="2.8" fill="#4f46e5"/><circle cx="31" cy="11" r="2.8" fill="#4f46e5"/></g><g transform="translate(376,314)"><rect width="44" height="22" rx="11" fill="#ffffff" stroke="#4f46e5"/><circle cx="13" cy="11" r="2.8" fill="#4f46e5"/><circle cx="22" cy="11" r="2.8" fill="#4f46e5"/><circle cx="31" cy="11" r="2.8" fill="#4f46e5"/></g><g transform="translate(454,225)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/><rect x="11" y="16" width="11" height="11" rx="3" fill="#4f46e5"/><rect x="26" y="16" width="11" height="11" rx="3" fill="#16a34a"/><rect x="11" y="31" width="11" height="11" rx="3" fill="#d97706"/><rect x="26" y="31" width="11" height="11" rx="3" fill="#0ea5e9"/></g><text x="480" y="329" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="middle">YOU</text><g transform="translate(229,157)"><rect width="52" height="85" rx="10" fill="#1e293b"/><rect x="5" y="7" width="43" height="71" rx="4" fill="#f1f5f9"/><rect x="11" y="16" width="11" height="11" rx="3" fill="#4f46e5"/><rect x="26" y="16" width=