g transform="translate(462,390)"><rect width="36" height="60" rx="8" fill="#e2e8f0"/><rect x="4" y="6" width="28" height="48" rx="4" fill="#ffffff"/></g><line x1="70" y1="108" x2="100" y2="108" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><text x="110" y="112" font-size="12.5" fill="#475569">an app: a signed manifest + files, pulled from a friend</text><line x1="70" y1="127" x2="100" y2="127" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><text x="110" y="131" font-size="12.5" fill="#475569">what the app says: messages, rings, moves — between Circle members</text><rect x="60" y="480" width="840" height="62" rx="12" fill="#ecfdf5" stroke="#16a34a"/><text x="480" y="506" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle">An app from Ana. A chat with Ben and Cleo through it. Dan catches up when he's back — no server ever involved.</text><text x="480" y="528" font-size="13" fill="#166534" text-anchor="middle">Everyone who has an app can pass it on, so apps spread on their own. Each app asks before it may reach your Circle.</text></svg>