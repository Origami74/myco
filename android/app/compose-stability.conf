// Compose compiler stability configuration (see build.gradle.kts).
//
// Only list a type here if every instance is deeply immutable: all `val`s, of
// types that are themselves immutable. Marking a mutable type stable makes
// Compose skip recompositions it needs, which shows as a frozen screen.

// The read-only collection interfaces. The app never mutates a collection
// after handing it to a composable; the core state is parsed into fresh lists
// on every poll.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

