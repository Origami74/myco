<!doctype html>
<meta charset="utf-8">
<title>Myco napplet shell</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
<script>
// The napplet shell. Trusted code, shipped in the APK, never fetched and never
// mesh-updatable — it is not content.
//
// It does four things and deliberately nothing else:
//   1. create the sandboxed iframe and set its srcdoc to verified bytes,
//   2. carry messages both ways,
//   3. verify MessageEvent.source on every inbound message,
//   4. hand everything else to Rust.
// It also reads an upload's bytes (NAP-UPLOAD) into base64, since a Blob
// does not survive the JSON channel to Rust.
// It also keeps keyboard focus in the napplet's frame, where the back
// gesture arrives as an Escape keydown.
//
// It holds no key, opens no connection, and makes no policy decision — its
// one fetch reads a delivered blob from its own origin, which the window
// host serves itself and never sends to the network. Every
// capability is implemented on the Rust side; this page cannot grant anything
// because it has nothing to grant.
(function () {
  'use strict';

  // Injected by addWebMessageListener, scoped to this shell's origin. The
  // napplet's iframe has an opaque origin and matches no origin rule, so this
  // object does not exist inside it — which is the whole reason for
  // addWebMessageListener over addJavascriptInterface, whose object lands in
  // every frame including the napplet's.
  var runtime = window.mycoNappletRuntime;

  var frame = null;
  // Where this window's delivered blobs are served, from the load command:
  // `<blobBase><sha256>`. It holds a per-window secret, so it stays here —
  // never in anything posted to the napplet.
  var blobBase = null;

  function toRuntime(payload) {
    if (runtime) runtime.postMessage(JSON.stringify(payload));
  }

  // --- runtime -> shell -------------------------------------------------

  function onRuntimeFrame(raw) {
    var frameData;
    try {
      frameData = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (frameData.channel === 'shell') {
      if (frameData.action === 'load') load(frameData);
      return;
    }

    if (frameData.channel === 'napplet') {
      if (frame && frame.contentWindow) {
        var message = frameData.message;
        if (carriesBlobs(message)) {
          materialize(message).then(post);
        } else {
          post(message);
        }
      }
    }
  }

  function post(message) {
    // '*' is required, not lax: the napplet's origin is opaque, so there is
    // no origin string that would ever match it.
    if (frame && frame.contentWindow) frame.contentWindow.postMessage(message, '*');
  }

  // NAP-RESOURCE bytes never ride the runtime's JSON channel. A result names
  // its blob by `blobRef` (a sha256); the bytes are fetched here, from this
  // page's own origin, where the window host serves them to the holder of
  // `blobBase` only. The napplet's shim resolves `resource.bytes()` with
  // `result.blob` as a Blob, typed by the runtime's sniffed `mime` — built
  // here, in trusted code, with `blobRef` taken out. A blob that cannot be
  // fetched becomes the error the napplet would have had anyway.
  function carriesBlobs(message) {
    return !!message && typeof message === 'object' &&
      (message.type === 'resource.bytes.result' || message.type === 'resource.bytesMany.result');
  }

  function fetchBlob(sha, mime) {
    var type = typeof mime === 'string' ? mime : 'application/octet-stream';
    if (!blobBase || typeof sha !== 'string' || !/^[0-9a-f]{64}$/.test(sha)) {
      return Promise.reject(new Error('no such blob'));
    }
    return fetch(blobBase + sha, { cache: 'no-store' }).then(function (response) {
      if (!response.ok) throw new Error('blob ' + response.status);
      return response.arrayBuffer();
    }).then(function (bytes) {
      return new Blob([bytes], { type: type });
    });
  }

  function withoutRef(obj) {
    var out = Object.assign({}, obj);
    delete out.blobRef;
    return out;
  }

  function materialize(message) {
    if (message.type === 'resource.bytes.result') {
      return fetchBlob(message.blobRef, message.mime).then(function (blob) {
        return Object.assign(withoutRef(message), { blob: blob });
      }, function () {
        return {
          type: 'resource.bytes.error',
          id: message.id,
          error: 'not-found',
          message: 'the blob went missing before it could be delivered'
        };
      });
    }
    var items = Array.isArray(message.items) ? message.items : [];
    return Promise.all(items.map(function (item) {
      if (!item || typeof item.blobRef !== 'string') return item;
      return fetchBlob(item.blobRef, item.mime).then(function (blob) {
        return Object.assign(withoutRef(item), { blob: blob });
      }, function () {
        return { url: item.url, ok: false, error: 'not-found' };
      });
    })).then(function (done) {
      return Object.assign({}, message, { items: done });
    });
  }

  function load(command) {
    // One napplet per shell, for one lifetime. Reloading in place would leave
    // the previous napplet's frame reachable and its session ambiguous.
    if (frame) return;
    blobBase = typeof command.blobs === 'string' ? command.blobs : null;

    frame = document.createElement('iframe');
    // Exactly what the runtime specified, and nothing this page composes
    // itself. A same-origin grant alongside allow-scripts would let the frame
    // reach into this origin and clear its own sandbox, so the token is never
    // written here — the runtime owns the value and a Rust test pins it.
    frame.setAttribute('sandbox', command.sandbox);
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.srcdoc = command.artifact;
    // Keyboard focus lives in the napplet's frame, not this page: the back
    // gesture arrives as an Escape keydown, and the napplet has to be the one
    // that hears it (NappletActivity.onBack). Focused again on load, since
    // the srcdoc document replaces the initial one.
    frame.addEventListener('load', function () { frame.focus(); });
    document.body.appendChild(frame);
    frame.focus();
  }

  // --- napplet -> shell -------------------------------------------------

  window.addEventListener('message', function (event) {
    // The unforgeable check. A Window reference cannot be spoofed, so this
    // binds the message to the frame we created and drops anything from a
    // popup, another frame, or the top window.
    if (!frame || event.source !== frame.contentWindow) return;

    // Wrapped, never forwarded raw — the channel tag is written here, by
    // trusted code, so a napplet cannot dress a message up as shell control
    // traffic.
    var message = event.data;
    // An upload goes on once its bytes are read, so a message the napplet
    // sends after it can reach Rust first. Nothing depends on that order
    // today; a later message type that does must not take this path.
    if (isUpload(message)) {
      withUploadBytes(message).then(function (carried) {
        toRuntime({ channel: 'napplet', message: carried });
      });
      return;
    }
    toRuntime({ channel: 'napplet', message: message });
  });

  // NAP-UPLOAD bytes. `request.data` is a Blob or an ArrayBuffer, which the
  // JSON channel to Rust would flatten to `{}`. So it is read here and sent as
  // base64 in `request.dataBase64`, with the blob's own type as
  // `request.dataType`. These names are this page's: whatever the napplet put
  // under them is dropped first. Rust decodes, re-checks the cap and hashes;
  // the bytes are still the napplet's and are treated so.
  //
  // Past the cap nothing is read: the request goes on with only
  // `request.dataSize`, and Rust answers the refusal. The decision stays on
  // the Rust side (`nap::upload::MAX_BYTES`, which a test pins this to).
  var UPLOAD_MAX_BYTES = 16777216;

  function isUpload(message) {
    return !!message && typeof message === 'object' && message.type === 'upload.upload' &&
      !!message.request && typeof message.request === 'object';
  }

  function withUploadBytes(message) {
    var request = Object.assign({}, message.request);
    var data = request.data;
    delete request.data;
    delete request.dataBase64;
    delete request.dataType;
    delete request.dataSize;
    var carried = Object.assign({}, message, { request: request });

    var size = null;
    var read = null;
    if (typeof Blob !== 'undefined' && data instanceof Blob) {
      size = data.size;
      if (data.type) request.dataType = String(data.type);
      read = function () { return data.arrayBuffer(); };
    } else if (data instanceof ArrayBuffer) {
      size = data.byteLength;
      read = function () { return Promise.resolve(data); };
    } else if (ArrayBuffer.isView(data)) {
      size = data.byteLength;
      read = function () {
        return Promise.resolve(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
      };
    }
    // Not bytes at all: Rust says so.
    if (read === null) return Promise.resolve(carried);
    if (size > UPLOAD_MAX_BYTES) {
      request.dataSize = size;
      return Promise.resolve(carried);
    }
    return read().then(function (buffer) {
      request.dataBase64 = toBase64(new Uint8Array(buffer));
      return carried;
    }).catch(function () {
      // Unreadable (a revoked or failed blob), or too big to encode here:
      // sent without bytes, refused by Rust like any other missing data,
      // rather than never sent and left to the napplet's timeout.
      delete request.dataBase64;
      return carried;
    });
  }

  function toBase64(bytes) {
    // In chunks: one `fromCharCode` over megabytes overflows the stack.
    var parts = [];
    for (var i = 0; i < bytes.length; i += 0x8000) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)));
    }
    return btoa(parts.join(''));
  }

  // --- start ------------------------------------------------------------

  if (runtime) {
    runtime.onmessage = function (event) {
      onRuntimeFrame(event.data);
    };
  }

  // Tell Rust the listeners are installed. Same shape as the napplet's own
  // handshake, one layer out: nothing is delivered before the receiver exists.
  toRuntime({ channel: 'shell', action: 'mounted' });
})();
</script>
