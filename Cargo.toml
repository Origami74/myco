# Myco — Cargo workspace.
#
# Six crates build into one native library (`libmyco_core.so`):
#   myco-core    — app crate: device identity, embedded FIPS node, JNI/JSON FFI
#   nsite-deck   — reusable nsite host: gateway + sync + propagator (P2/P3)
#   myco-relay   — embedded NIP-01 relay (RelayBackend) over nostr-lmdb
#   myco-blossom — embedded Blossom blob store (BlobStore) (P2)
#   myco-napplet-runtime — NIP-5D napplet runtime: manifests, resolution, seams
#   myco-cache   — shell-wide bounded event + blob cache (segmented LRU)
#
# `fips` is a LOCAL checkout under reference/fips (gitignored), wired as a path
# dependency. See docs/how-to/build.md.
[workspace]
resolver = "2"
members = ["myco-core", "nsite-deck", "myco-relay", "myco-blossom", "myco-cache", "myco-napplet-runtime"]
# `reference/fips` is a path dependency that lives inside the workspace root,
# which would make it an implicit member: `--workspace` would then lint, test
# and format fips itself. It is upstream code with its own warnings; keep it a
# dependency only, so `cargo clippy --workspace -- -D warnings` can gate on
# Myco's crates alone.
exclude = ["reference/fips"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Origami74/myco"

[workspace.dependencies]
# default-features = false drops desktop-only `ethernet` + `system-tun`; Myco is
# mobile-first (Android now, iOS later) and provides any TUN itself (app-owned).
fips = { path = "reference/fips", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
hex = "0.4"
# Multi-thread runtime so the embedded fips node's background tasks (BLE
# accept/scan/probe loops, Noise handshakes) keep progressing between FFI polls,
# without the app having to drive the node's main packet loop (that's P2+).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }

# --- P2 content layer (relay + Blossom + gateway) ---
# The rust-nostr `nostr` crate supplies Event types, NIP-01 id computation,
# Schnorr signature verification, and NIP-19 (npub) — the cryptographic /
# serialization primitives. The relay STORE and the WS/REQ surface are
# hand-rolled (the query surface Myco uses is tiny; no relay framework, and
# negentropy/NIP-77 is not needed until P3). See docs/design/nsite/nsite-layer.md §2.1.
nostr = { version = "0.44", default-features = false, features = ["std", "nip44", "nip59"] }
# The relay's persistent store: rust-nostr's LMDB backend. Indexed NIP-01
# queries over an mmap — reads are page-cache hits, idle cost is nothing, and
# negentropy (NIP-77) comes with it for P3. Pinned to the `nostr` 0.44 line.
nostr-lmdb = { version = "0.44", default-features = false }
nostr-database = { version = "0.44", default-features = false }
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
thiserror = "2"

# IP online-fallback sync (P2 M3): query public relays (WS) + pull blobs from
# public Blossom (HTTPS) to side-load a pasted nsite link over normal internet.
# rustls (not native-tls) so it cross-compiles cleanly for Android.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The internet relay pool: one shared, multiplexed connection per relay.
# Not on crates.io; pinned to a reviewed commit.
rustic-applesauce = { git = "https://github.com/hzrd149/rustic-applesauce", rev = "f026dca246b8f3b8cba4ba7c9bcf0fafdc877af9" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The embedded relay (WS, NIP-01) + Blossom (HTTP) servers that serve the node's
# manifest events + blobs to mesh peers over `.fips` (P3).
axum = { version = "0.8", features = ["ws"] }
# Bind the mesh servers IPV6_V6ONLY so `[::]:port` doesn't collide with another
# app squatting on `127.0.0.1:port` (the mesh is IPv6-only anyway).
socket2 = "0.6"

# The release library ships inside the APK, so build it small: one codegen
# unit with whole-program LTO lets the linker drop unused code across crates,
# and stripping removes the symbol tables (a third of the file). Panics still
# unwind (no `panic = "abort"`): tokio contains a panicking task instead of
# the whole app going down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
