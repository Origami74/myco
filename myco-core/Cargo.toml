[package]
name = "myco-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "myco_core"
# `lib` (rlib) for host unit tests; `cdylib` for the Android `libmyco_core.so`.
crate-type = ["lib", "cdylib"]

[dependencies]
fips = { workspace = true }
nsite-deck = { path = "../nsite-deck" }
myco-napplet-runtime = { path = "../myco-napplet-runtime" }
myco-relay = { path = "../myco-relay" }
myco-blossom = { path = "../myco-blossom" }
nostr = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# The mesh relay proxy (`mesh_relay`) is an axum WebSocket server, bound
# IPV6_V6ONLY via socket2 so `[::]:4870` does not collide with the loopback bind.
axum = { workspace = true }
socket2 = { workspace = true }
# `dns_intercept` synthesises the AAAA query it sends to the node's built-in
# `.fips` responder for route warming. Matches fips's pin.
simple-dns = "0.11.2"

[features]
# Build against a fips checkout that carries multi-path switchover
# (`feat/multi-path-switchover`): the BLE transport is configured as a
# `backup` path so Wi-Fi Aware and the LAN carry a peer whenever they can.
# Off by default so the crate builds against fips master, which has no path
# roles; everything else multi-path — the `paths` array in `show_peers` —
# is read when present and absent otherwise, no feature needed. The Android
# Gradle build turns this on by itself when `MYCO_FIPS_REPO_PATH` points at
# a checkout that has it (see `android/app/build.gradle.kts`).
fips-multipath = []

[dev-dependencies]
# Drive the axum routers directly in tests, so a handler can be exercised with a
# synthetic peer address (a real socket can only ever be loopback here).
tower = { version = "0.5", features = ["util"] }
nsite-deck = { path = "../nsite-deck", features = ["testing"] }
myco-napplet-runtime = { path = "../myco-napplet-runtime", features = ["testing"] }
tokio-tungstenite = { workspace = true }

# The JNI surface only exists on Android. Host (macOS/Linux) builds skip it and
# drive `AppRuntime` directly (see tests).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Bridge `tracing` (ours + fips) to Android logcat so the sync/FSP/BLE internals
# are visible with `adb logcat -s myco`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
paranoid-android = "0.2"
